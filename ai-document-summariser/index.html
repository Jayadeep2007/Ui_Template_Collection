<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Document Summarizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Moving background. To use a real video instead, put bg.mp4 in this folder and uncomment the <video> line. -->
<div class="bg" aria-hidden="true">
  <!-- <video class="bg-video" src="bg.mp4" autoplay muted loop playsinline></video> -->
  <span class="orb o1"></span>
  <span class="orb o2"></span>
  <span class="orb o3"></span>
  <span class="grain"></span>
</div>
<div class="glow" id="glow" aria-hidden="true"></div>

<header class="nav">
  <a class="back" href="../index.html">&larr; AI Interface Collection</a>
</header>

<main class="wrap">
  <h1>Paste a long document.<br>Get the short version.</h1>
  <p class="lead">Drop in text or upload a .txt file and choose how short you want the summary.</p>

  <section class="panel">
    <textarea id="input" placeholder="Paste your document here..." rows="9"></textarea>

    <div class="controls">
      <label class="file">
        <input type="file" id="file" accept=".txt,text/plain">
        <span>Upload .txt file</span>
      </label>

      <label class="len">
        Summary length
        <input type="range" id="len" min="1" max="8" value="3">
        <output id="lenOut">3 sentences</output>
      </label>

      <button id="go" class="btn">Summarize</button>
    </div>
  </section>

  <section class="panel result" id="result" hidden>
    <div class="stats" id="stats"></div>
    <p id="summary"></p>
    <button id="copy" class="btn ghost">Copy summary</button>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA ANALYTICS — Ask your data</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"></div>
<aside class="side">
  <div class="logo">NOVA<br><span>ANALYTICS</span></div>
  <nav>
    <button data-go="top">Dashboard</button>
    <h4>Data</h4>
    <button data-go="data">Upload Dataset</button>
    <button data-go="preview">Dataset Preview</button>
    <button data-go="profile">Data Profile</button>
    <h4>AI Analyst</h4>
    <button data-go="ask">Ask Question</button>
    <button data-q="Generate insights">Generate Insights</button>
    <h4>Analysis</h4>
    <button data-q="Show statistics">Statistics</button>
    <button data-q="@compare">Comparisons</button>
    <button data-q="@trend">Trends</button>
    <h4>&nbsp;</h4>
    <button data-go="settings">Settings</button>
  </nav>
  <div class="mini" id="mini"></div>
</aside>
<main id="top">
  <header>
    <div><h1>NOVA ANALYTICS</h1><p>Ask your data. Get the answer.</p></div>
    <div class="hright">
      <div class="pill" id="ready">● DATA READY</div>
      <a href="../index.html" class="back-home">← Back to Home</a>
    </div>
  </header>
  <div id="err" class="err" hidden></div>
  <section class="stats" id="stats"></section>
  <div class="grid">
    <section class="card" id="data">
      <h3>Data</h3>
      <div class="row">
        <button class="btn" id="upCsv">Upload CSV</button>
        <button class="btn" id="upJson">Upload JSON</button>
      </div>
      <input type="file" id="file" hidden>
      <p class="muted">Processed locally in your browser. Nothing is uploaded.</p>
      <h3 id="profile">Data Profile</h3>
      <div id="prof"></div>
    </section>
    <section class="card ai" id="ask">
      <div class="aihead">
        <div class="orb-wrap" id="orbw"><div class="orb"></div></div>
        <div><h3>AI Analyst</h3><div class="state" id="state">IDLE</div><div class="steps" id="steps">Ask anything about your data</div></div>
        <div class="exp"><button class="btn sm" id="exCsv">Export CSV</button><button class="btn sm" id="exJson">Export JSON</button></div>
      </div>
      <div class="chips" id="chips"></div>
      <div class="msgs" id="msgs"></div>
      <div class="inp"><input id="q" placeholder="Ask anything about your data..." autocomplete="off"><button class="btn go" id="send">Ask</button></div>
      <div class="hist"><b>Recent Questions</b><div id="hist"></div></div>
    </section>
  </div>
  <section class="card" id="preview">
    <h3>Dataset Preview</h3>
    <div class="tw" id="prev"></div>
    <div class="row pg"><button class="btn sm" id="prevB">Previous</button><span id="pgInfo" class="muted"></span><button class="btn sm" id="nextB">Next</button></div>
  </section>
  <section class="card" id="settings">
    <h3>Settings</h3>
    <div class="row"><button class="btn sm" id="clr">Clear history</button><button class="btn sm" id="smp">Load sample data</button></div>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
